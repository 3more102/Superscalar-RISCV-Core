name: Apply EDA hotfix

on:
  push:
    paths:
      - ".github/workflows/apply-eda-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('rtl/core/superscalar_core.sv')
          s=p.read_text()
          s=s.replace('''    .aligned_addr(lsu_aligned_addr), .store_wdata(lsu_store_wdata),\n    .store_be(lsu_store_be), .load_value(lsu_load_value),\n    .misaligned()\n''','''    .aligned_addr(lsu_aligned_addr), .store_wdata(lsu_store_wdata),\n    .store_be(lsu_store_be), .load_value(lsu_load_value)\n''')
          s=s.replace('''    commit0_rd = wb0_q.dec.rd;\n    commit0_value = wb0_q.wb_value;\n''','''    // Normalize architecturally inactive writeback fields.  The commit trace\n    // is a public verification interface, so non-writing instructions must not\n    // expose encoding residue from instr[11:7] or datapath don't-care values.\n    commit0_rd = commit0_rd_we ? wb0_q.dec.rd : 5'd0;\n    commit0_value = commit0_rd_we ? wb0_q.wb_value : 32'd0;\n''')
          s=s.replace('''    commit1_rd = wb1_q.dec.rd;\n    commit1_value = wb1_q.wb_value;\n''','''    commit1_rd = commit1_rd_we ? wb1_q.dec.rd : 5'd0;\n    commit1_value = commit1_rd_we ? wb1_q.wb_value : 32'd0;\n''')
          p.write_text(s)

          p=Path('rtl/memory/load_store_unit.sv')
          s=p.read_text()
          s=s.replace(',\n  output logic [31:0]         load_value,\n  output logic                misaligned\n);',',\n  output logic [31:0]         load_value\n);')
          s=s.replace("    misaligned = 1'b0;\n",'')
          s=s.replace('        misaligned = eff_addr[0];\n','')
          s=s.replace('        misaligned = |eff_addr[1:0];\n','')
          s=s.replace("      default: begin\n        misaligned = 1'b1;\n      end\n","      default: begin\n      end\n")
          p.write_text(s)

          p=Path('rtl/mdu/div_unit.sv')
          s=p.read_text()
          s=s.replace('  localparam int CW = (LATENCY <= 1) ? 1 : $clog2(LATENCY);\n','  localparam int CW = (LATENCY <= 1) ? 1 : $clog2(LATENCY);\n  localparam logic [CW-1:0] LAST_CYCLE = CW\'(LATENCY - 1);\n')
          s=s.replace('if (cycle_q == LATENCY-1)', 'if (cycle_q == LAST_CYCLE)')
          p.write_text(s)

          for fp in Path('formal').glob('*.sby'):
              fp.write_text(fp.read_text().replace('plugin -i slang\n',''))

          Path('scripts/run_formal.py').write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport os, shutil, stat, subprocess, tempfile\n\nROOT=Path(__file__).resolve().parents[1]\nout=ROOT/'reports'/'formal'/'formal_report.txt'\nout.parent.mkdir(parents=True,exist_ok=True)\nsby=shutil.which('sby'); yosys=shutil.which('yosys')\nif not sby or not yosys:\n    out.write_text('FORMAL: TOOL UNAVAILABLE (requires sby and yosys).\\nFormal harnesses are present under formal/.\\n')\n    print(out.read_text(),end=''); raise SystemExit(2)\nprobe=subprocess.run([yosys,'-m','slang','-Q','-p','help read_slang'],cwd=ROOT,text=True,capture_output=True)\nif probe.returncode!=0 or 'No such command' in (probe.stdout+probe.stderr):\n    out.write_text('FORMAL: TOOL UNAVAILABLE (yosys-slang/read_slang frontend not available).\\n')\n    print(out.read_text(),end=''); raise SystemExit(2)\nresults=[]\nwith tempfile.TemporaryDirectory(prefix='sby-yosys-') as td:\n    wrapper=Path(td)/'yosys'\n    wrapper.write_text(f'#!/bin/sh\\nexec "{yosys}" -m slang "$@"\\n')\n    wrapper.chmod(wrapper.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)\n    env=os.environ.copy()\n    env['PATH']=td+os.pathsep+env.get('PATH','')\n    for cfg in ['formal/issue.sby','formal/alu_branch.sby','formal/core.sby']:\n        cp=subprocess.run([sby,'-f',cfg],cwd=ROOT,text=True,capture_output=True,env=env)\n        results.append((cfg,cp.returncode,cp.stdout+cp.stderr))\nwith out.open('w') as f:\n    for cfg,rc,text in results:\n        f.write(f'=== {cfg} rc={rc} ===\\n{text}\\n')\nprint(out.read_text(),end='')\nraise SystemExit(0 if all(rc==0 for _,rc,_ in results) else 1)\n''')

          Path('scripts/run_lint.py').write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport re, shutil, subprocess, sys\nROOT=Path(__file__).resolve().parents[1]\nreport=ROOT/'reports'/'lint_report.txt'\nverilator=shutil.which('verilator')\nif not verilator:\n    subprocess.run([sys.executable,'scripts/static_rtl_audit.py'],cwd=ROOT)\n    report.write_text('VERILATOR LINT: TOOL UNAVAILABLE\\nSee reports/static_rtl_audit.txt for the non-compiler source audit.\\n')\n    print(report.read_text(),end=''); raise SystemExit(2)\ncmd=[verilator,'--lint-only','-Wall','-Wno-fatal','--timing','-Wno-DECLFILENAME',\n     '--top-module','superscalar_core','-f','sim/rtl_filelist.f']\ncp=subprocess.run(cmd,cwd=ROOT,text=True,capture_output=True)\ntext=cp.stdout+cp.stderr\nwarning_codes=re.findall(r'%Warning-([A-Z0-9_]+):',text)\nallow={'UNUSEDSIGNAL','UNUSEDPARAM'}\nunexpected=sorted(set(warning_codes)-allow)\nsummary=(f'\\nLINT POLICY: warnings={len(warning_codes)}; allowed={sorted(allow)}; unexpected={unexpected}\\n')\nreport.write_text(text+summary)\nprint(report.read_text(),end='')\nif cp.returncode!=0:\n    raise SystemExit(cp.returncode)\nraise SystemExit(1 if unexpected else 0)\n''')

          p=Path('scripts/audit_formal_flow.py')
          p.write_text(p.read_text().replace("'plugin -i slang'", "'read_slang'"))
          p=Path('scripts/audit_tool_flows.py')
          s=p.read_text()
          s=s.replace("'scripts/run_formal.py':[\"[yosys,'-m','slang'\",'formal/core.sby'],", "'scripts/run_formal.py':[\"[yosys,'-m','slang'\",\"env['PATH']=td+os.pathsep\",'formal/core.sby'],")
          s=s.replace("'formal/core.sby':['plugin -i slang','formal/core_harness.sv','-D FORMAL'],", "'formal/core.sby':['read_slang','formal/core_harness.sv','-D FORMAL'],")
          p.write_text(s)
          PY
          python3 scripts/static_rtl_audit.py
          python3 scripts/audit_formal_flow.py
          python3 scripts/audit_tool_flows.py
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtl formal scripts
          git commit -m "fix: harden EDA verification interfaces and flows"
          git push
