name: RTL CI

on:
  push:
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-reference:
    name: Python / Reference Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python test dependency
        run: python3 -m pip install pytest
      - name: Tool inventory
        run: python3 scripts/detect_tools.py
      - name: Generate directed programs
        run: python3 scripts/gen_directed_tests.py
      - name: Architectural reference regression
        run: python3 scripts/run_reference_regression.py
      - name: Cycle-oriented microarchitecture regression
        run: python3 scripts/run_microarchitecture_regression.py
      - name: Divider differential stress
        run: python3 scripts/run_divider_stress.py
      - name: Front-end replay stress
        run: python3 scripts/run_frontend_replay_stress.py
      - name: Python model tests
        run: python3 -m pytest -q tb/tests/test_reference.py tb/tests/test_microarchitecture.py
      - name: ISA exercise check
        run: python3 scripts/check_isa_coverage.py
      - name: Reference/stimulus coverage
        run: python3 scripts/reference_functional_coverage.py
      - name: RTL source audit
        run: python3 scripts/static_rtl_audit.py
      - name: Formal-flow source audit
        run: python3 scripts/audit_formal_flow.py
      - name: Tool-flow source audit
        run: python3 scripts/audit_tool_flows.py
      - name: Archive reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-verification-reports
          path: reports/

  rtl-simulation:
    name: RTL Simulation / Coverage / Performance
    needs: python-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Python test dependency
        run: python3 -m pip install pytest
      - name: RTL commit-trace regression
        run: make rtl
      - name: RTL functional coverage
        run: make rtl-coverage
      - name: RTL single-vs-dual performance
        run: make rtl-perf
      - name: Archive RTL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-simulation-reports
          path: |
            reports/simulation/
            reports/coverage/
            reports/performance/

  lint:
    name: Verilator Lint
    needs: python-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Verilator lint
        run: make lint
      - name: Archive lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/lint_report.txt

  formal:
    name: Formal Verification
    needs: python-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run SymbiYosys targets
        run: make formal
      - name: Archive formal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-reports
          path: reports/formal/

  synthesis:
    name: Yosys Synthesis
    needs: python-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run generic synthesis
        run: make synth
      - name: Archive synthesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-report
          path: reports/synthesis/
